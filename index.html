<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#292e88"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Çay & Fon"><link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Hask%C3%B6y%20Ortaokulu%20-%20%C3%87ay%20%26%20Fon%20Takip%22%2C%22short_name%22%3A%22%C3%87ay%20%26%20Fon%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f5f6fb%22%2C%22theme_color%22%3A%22%23292e88%22%7D"><title>Çay & Fon Takip</title><style>
:root{--navy:#292e88;--orange:#ec6701;--bg:#f5f6fb;--card:#fff;--text:#171a2b;--muted:#73788f;--line:#e6e8f0;--green:#16864a;--red:#c93a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text)}button,input,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{background:linear-gradient(135deg,var(--navy),#4147a7);color:#fff;padding:22px 18px 18px;border-radius:0 0 26px 26px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:21px;margin:0}.brand small{opacity:.72}.month{margin-top:16px;display:flex;gap:9px}.month select{flex:1;background:#fff;color:var(--text);border:0;border-radius:12px;padding:12px 13px;font-weight:700}.icon{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;width:44px}.content{padding:18px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px}.stat .label{font-size:12px;color:var(--muted)}.stat b{font-size:22px;display:block;margin-top:5px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px}.card h3{font-size:14px;margin:0 0 10px}.amount{font-size:20px;font-weight:800}.amount span{font-size:12px;color:var(--muted);font-weight:500}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section-title h2{font-size:17px;margin:0}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:var(--orange);color:#fff}.secondary{background:#eef0ff;color:var(--navy)}.teacher{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px}.teacher-head{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:13px;background:#eef0ff;color:var(--navy);display:grid;place-items:center;font-weight:800}.name{font-weight:750;flex:1}.status{font-size:11px;color:var(--muted)}.payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.pay{border:1px solid var(--line);background:#fafbfe;border-radius:12px;padding:9px;display:flex;justify-content:space-between;align-items:center}.pay b{font-size:12px}.pay button{border:0;border-radius:9px;padding:7px 9px;font-weight:800;font-size:12px}.paid{background:#e9f7ef;color:var(--green)}.unpaid{background:#fff0f0;color:var(--red)}.empty{background:#fff;border:1px dashed #cfd3e2;padding:25px;border-radius:16px;text-align:center;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--muted);padding:8px;border-radius:12px;font-size:12px}.nav button.active{color:var(--navy);background:#eef0ff;font-weight:800}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:20px}.sheet h2{margin:0 0 15px}.field{margin:10px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:0}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.settings{display:grid;gap:12px}.setting{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.setting input{width:110px;margin-left:auto;padding:9px;border:1px solid var(--line);border-radius:10px}.row{display:flex;align-items:center;gap:10px}.hidden{display:none!important}@media(min-width:700px){.content{padding:24px}.top{padding:24px}.modal{align-items:center}.sheet{border-radius:22px;max-width:520px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div><small>OKUL ÖDEME TAKİP</small><h1>Çay & Fon Takip</h1></div><button class="icon" onclick="openSettings()">⚙️</button></div><div class="month"><select id="month" onchange="render()"></select><button class="icon" onclick="addTeacher()">＋</button></div></header><section class="content"><div id="dashboard"></div><div id="teachersView"></div><div id="settingsView" class="hidden"></div></section></main><footer class="bottom"><nav class="nav"><button id="navDash" class="active" onclick="showView('dash')">🏠<br>Özet</button><button id="navTeachers" onclick="showView('teachers')">👥<br>Öğretmenler</button><button id="navSettings" onclick="showView('settings')">⚙️<br>Ayarlar</button></nav></footer><div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle">Öğretmen Ekle</h2><div class="field"><label>Ad Soyad</label><input id="teacherName" placeholder="Örn. Ahmet Yılmaz"></div><div class="checks"><label class="check"><input type="checkbox" id="teaExempt"> ☕ Çay parasından muaf</label><label class="check"><input type="checkbox" id="fundExempt"> 💰 Fon parasından muaf</label></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn primary" onclick="saveTeacher()">Kaydet</button></div></div></div><script>
const KEY='cayFonTakipV1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{teachers:[],months:{},settings:{tea:150,fund:100}};let view='dash',editingId=null;db.teachers.forEach(t=>{t.teaExempt=!!t.teaExempt;t.fundExempt=!!t.fundExempt});function save(){localStorage.setItem(KEY,JSON.stringify(db))}function monthKey(){return document.getElementById('month').value}function monthData(){let k=monthKey();if(!db.months[k])db.months[k]={};return db.months[k]}function initMonths(){let s=document.getElementById('month');let now=new Date();let y=now.getFullYear(),m=now.getMonth()+1;let arr=[];for(let i=-6;i<7;i++){let d=new Date(y,m-1+i,1),k=d.toISOString().slice(0,7);arr.push(k)}s.innerHTML=arr.map(k=>{let [a,b]=k.split('-');return `<option value="${k}">${b}/${a}</option>`}).join('');s.value=`${y}-${String(m).padStart(2,'0')}`}function payment(id,type){let t=db.teachers.find(x=>x.id===id);if(!t||t[type+'Exempt'])return;let md=monthData();md[id]??={};md[id][type]=!md[id][type];md[id][type+'Date']=md[id][type]?new Date().toLocaleDateString('tr-TR'):null;save();render()}function stats(){let md=monthData(),t=db.teachers;let tea=t.filter(x=>!x.teaExempt&&md[x.id]?.tea).length,fund=t.filter(x=>!x.fundExempt&&md[x.id]?.fund).length;let teaDue=t.filter(x=>!x.teaExempt).length,fundDue=t.filter(x=>!x.fundExempt).length;return {tea,fund,teaDue,fundDue,totalTea:tea*db.settings.tea,totalFund:fund*db.settings.fund,total:tea*db.settings.tea+fund*db.settings.fund}}function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}function render(){let st=stats();document.getElementById('dashboard').innerHTML=`<div class="stats"><div class="stat"><div class="label">Toplam öğretmen</div><b>${db.teachers.length}</b></div><div class="stat"><div class="label">Toplam tahsilat</div><b>${st.total.toLocaleString('tr-TR')} ₺</b></div><div class="stat"><div class="label">☕ Çay</div><b>${st.tea}/${st.teaDue}</b></div><div class="stat"><div class="label">💰 Fon</div><b>${st.fund}/${st.fundDue}</b></div></div><div class="cards"><div class="card"><h3>☕ Çay tahsilatı</h3><div class="amount">${st.totalTea.toLocaleString('tr-TR')} ₺ <span>• ${db.settings.tea} ₺ / kişi</span></div></div><div class="card"><h3>💰 Fon tahsilatı</h3><div class="amount">${st.totalFund.toLocaleString('tr-TR')} ₺ <span>• ${db.settings.fund} ₺ / kişi</span></div></div></div><div class="section-title"><h2>Ödeme durumu</h2><button class="btn secondary" onclick="exportCSV()">📊 Excel</button></div><div id="recent">${teacherList(8)}</div>`;document.getElementById('teachersView').innerHTML=view==='teachers'?`<div class="section-title"><h2>Öğretmenler</h2><button class="btn primary" onclick="addTeacher()">+ Ekle</button></div>${teacherList()}`:'';document.getElementById('settingsView').innerHTML=view==='settings'?settingsHTML():''}function teacherList(limit){if(!db.teachers.length)return `<div class="empty">Henüz öğretmen eklenmedi.<br><button class="btn primary" style="margin-top:10px" onclick="addTeacher()">İlk öğretmeni ekle</button></div>`;let md=monthData();return db.teachers.slice(0,limit).map(t=>{let p=md[t.id]||{},teaLabel=t.teaExempt?'Muaf':p.tea?'Ödendi':'Ödenmedi',fundLabel=t.fundExempt?'Muaf':p.fund?'Ödendi':'Ödenmedi',badges=[t.teaExempt?'☕ Çay muaf':'',t.fundExempt?'💰 Fon muaf':''].filter(Boolean).join(' • '),status=t.teaExempt&&t.fundExempt?'Tam muaf':(!t.teaExempt&&p.tea)&&(!t.fundExempt&&p.fund)?'Tamamlandı':(!t.teaExempt&&p.tea)||(!t.fundExempt&&p.fund)?'Eksik ödeme':'Ödeme bekliyor';return `<div class="teacher"><div class="teacher-head"><div class="avatar">${initials(t.name)}</div><div class="name">${t.name}<div class="status">${badges||status}</div></div><button class="btn secondary" onclick="editTeacher('${t.id}')">Düzenle</button><button class="btn secondary" onclick="removeTeacher('${t.id}')">Sil</button></div><div class="payrow"><div class="pay"><b>☕ ${t.teaExempt?'Muaf':db.settings.tea+' ₺'}</b><button class="${t.teaExempt?'exempt':p.tea?'paid':'unpaid'}" onclick="payment('${t.id}','tea')">${teaLabel}</button></div><div class="pay"><b>💰 ${t.fundExempt?'Muaf':db.settings.fund+' ₺'}</b><button class="${t.fundExempt?'exempt':p.fund?'paid':'unpaid'}" onclick="payment('${t.id}','fund')">${fundLabel}</button></div></div></div>`}).join('')}function settingsHTML(){return `<div class="section-title"><h2>Ayarlar</h2></div><div class="settings"><div class="setting"><div class="row"><span>☕ Çay parası</span><input type="number" id="teaAmount" value="${db.settings.tea}"></div></div><div class="setting"><div class="row"><span>💰 Fon parası</span><input type="number" id="fundAmount" value="${db.settings.fund}"></div></div><button class="btn primary" onclick="saveSettings()">Ayarları Kaydet</button><button class="btn secondary" onclick="exportCSV()">📊 Excel uyumlu rapor indir</button><div class="setting"><b>💾 Veri Yedekleme</b><div class="status" style="margin:6px 0 10px">Telefon ve bilgisayar arasında veri taşımak için kullanabilirsiniz.</div><div class="actions"><button class="btn secondary" onclick="backupData()">Yedeği Dışa Aktar</button><button class="btn secondary" onclick="document.getElementById('backupFile').click()">Yedeği Yükle</button></div><input id="backupFile" type="file" accept=".json,application/json" class="hidden" onchange="restoreData(event)"></div><div class="setting"><b>🗑️ Verileri Sıfırla</b><div class="status" style="margin:6px 0 10px">Tüm öğretmen ve ödeme kayıtlarını siler.</div><button class="btn secondary" onclick="resetData()">Tüm Verileri Sıfırla</button></div></div>`}function showView(v){view=v;document.getElementById('dashboard').classList.toggle('hidden',v!=='dash');document.getElementById('teachersView').classList.toggle('hidden',v!=='teachers');document.getElementById('settingsView').classList.toggle('hidden',v!=='settings');['Dash','Teachers','Settings'].forEach(x=>document.getElementById('nav'+x).classList.toggle('active',v===x.toLowerCase().replace('dash','dash').replace('teachers','teachers').replace('settings','settings')));render()}function addTeacher(){editingId=null;document.getElementById('modalTitle').textContent='Öğretmen Ekle';document.getElementById('teacherName').value='';document.getElementById('teaExempt').checked=false;document.getElementById('fundExempt').checked=false;document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('teacherName').focus(),100)}function editTeacher(id){let t=db.teachers.find(x=>x.id===id);if(!t)return;editingId=id;document.getElementById('modalTitle').textContent='Öğretmeni Düzenle';document.getElementById('teacherName').value=t.name;document.getElementById('teaExempt').checked=!!t.teaExempt;document.getElementById('fundExempt').checked=!!t.fundExempt;document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('teacherName').focus(),100)}function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null}function saveTeacher(){let n=document.getElementById('teacherName').value.trim();if(!n)return;let teaExempt=document.getElementById('teaExempt').checked,fundExempt=document.getElementById('fundExempt').checked;if(editingId){let t=db.teachers.find(x=>x.id===editingId);if(t){t.name=n;t.teaExempt=teaExempt;t.fundExempt=fundExempt}}else db.teachers.push({id:crypto.randomUUID(),name:n,teaExempt,fundExempt});save();closeModal();render()}function removeTeacher(id){if(confirm('Bu öğretmen listeden silinsin mi?')){db.teachers=db.teachers.filter(x=>x.id!==id);save();render()}}function openSettings(){showView('settings')}function saveSettings(){let tea=Number(document.getElementById('teaAmount').value)||0,fund=Number(document.getElementById('fundAmount').value)||0;db.settings={tea,fund};save();render();alert('Ayarlar kaydedildi.')}function backupData(){let payload={app:'Hasköy Ortaokulu Çay & Fon Takip',version:1,exportedAt:new Date().toISOString(),data:db};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cay-fon-yedek-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restoreData(event){let file=event.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let payload=JSON.parse(reader.result),data=payload.data||payload;if(!data||!Array.isArray(data.teachers)||typeof data.months!=='object'||typeof data.settings!=='object')throw new Error('Geçersiz yedek');if(!confirm('Mevcut verilerin üzerine bu yedek yüklensin mi?'))return;db=data;db.teachers.forEach(t=>{t.teaExempt=!!t.teaExempt;t.fundExempt=!!t.fundExempt});save();initMonths();render();alert('Yedek başarıyla yüklendi.')}catch(e){alert('Yedek dosyası okunamadı. Lütfen uygulamanın oluşturduğu JSON yedeğini seçin.')}finally{event.target.value=''}};reader.readAsText(file)}function resetData(){if(confirm('TÜM öğretmen, ödeme ve ayar verileri silinsin mi? Bu işlem geri alınamaz.')){localStorage.removeItem(KEY);location.reload()}}function exportCSV(){let md=monthData(),k=monthKey(),rows=[['Öğretmen','Çay Durumu','Çay Tutarı','Çay Tarihi','Fon Durumu','Fon Tutarı','Fon Tarihi','Toplam']];db.teachers.forEach(t=>{let p=md[t.id]||{},teaStatus=t.teaExempt?'Muaf':p.tea?'Ödendi':'Ödenmedi',fundStatus=t.fundExempt?'Muaf':p.fund?'Ödendi':'Ödenmedi',teaAmount=t.teaExempt?0:p.tea?db.settings.tea:0,fundAmount=t.fundExempt?0:p.fund?db.settings.fund:0;rows.push([t.name,teaStatus,teaAmount,t.teaExempt?'':p.teaDate||'',fundStatus,fundAmount,t.fundExempt?'':p.fundDate||'',teaAmount+fundAmount])});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cay-fon-${k}.csv`;a.click();URL.revokeObjectURL(a.href)}initMonths();render();</script></body></html>
