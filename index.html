<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDP39vv_IMJHNHrXauWyfQ2VU9bqRinjTc",
    authDomain: "haskoy-cay-fon-takip.firebaseapp.com",
    projectId: "haskoy-cay-fon-takip",
    storageBucket: "haskoy-cay-fon-takip.firebasestorage.app",
    messagingSenderId: "1034982087143",
    appId: "1:1034982087143:web:d7c3e465d7b32225c58542",
    measurementId: "G-LG04T4X6JB"
  };

  const app = initializeApp(firebaseConfig);
  const dbFirestore = getFirestore(app);
  const docRef = doc(dbFirestore, "cayFonData", "mainDoc");

  window.appDb = {
    data: {teachers:[],months:{},settings:{tea:150,fund:100},expenses:[]},
    isReady: false,
    save: async function() {
      try {
        await setDoc(docRef, window.appDb.data);
      } catch (err) {
        console.error("Kayıt hatası:", err);
      }
    }
  };

  // Sayfa açıldığında önce yerel/varsayılan ayarları yapalım ki select hemen dolsun
  setTimeout(() => {
    if(typeof initMonths === 'function') initMonths();
  }, 50);

  // Gerçek zamanlı senkronizasyon (Canlı dinleme)
  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      let data = docSnap.data();
      window.appDb.data.teachers = Array.isArray(data.teachers) ? data.teachers : [];
      window.appDb.data.months = (data.months && typeof data.months === 'object') ? data.months : {};
      window.appDb.data.settings = data.settings || {tea:150,fund:100};
      window.appDb.data.expenses = Array.isArray(data.expenses) ? data.expenses : [];
    } else {
      window.appDb.save();
    }
    window.appDb.data.teachers.forEach(t=>{t.teaExempt=!!t.teaExempt;t.fundExempt=!!t.fundExempt});
    if(!window.appDb.isReady) {
      window.appDb.isReady = true;
      if(typeof initMonths === 'function') initMonths();
    }
    if(typeof render === 'function') render();
  }, (error) => {
    console.error("Firebase bağlantı hatası:", error);
  });
</script>

<script>

  get teachers(){ return window.appDb ? window.appDb.data.teachers : []; },

  get months(){ return window.appDb ? window.appDb.data.months : {}; },
  set months(v){ if(window.appDb) window.appDb.data.months = v; },
  get settings(){ return window.appDb ? window.appDb.data.settings : {tea:150,fund:100}; },
  set settings(v){ if(window.appDb) window.appDb.data.settings = v; },
  get expenses(){ return window.appDb ? window.appDb.data.expenses : []; },
  set expenses(v){ if(window.appDb) window.appDb.data.expenses = v; }
};
window.db = dbProxy;
function save() { if(window.appDb) window.appDb.save(); }
</script>
<script>
window.addEventListener('load',()=>{
  const oldBulkSettings=settingsHTML;
  window.settingsHTML=function(){return oldBulkSettings()+'<div class="setting"><b>📥 Öğretmenleri Toplu Yükle</b><div class="status" style="margin:6px 0 10px">Excel (.xlsx/.xls) veya CSV dosyasındaki ilk sütundaki isimleri topluca ekler.</div><button class="btn primary" onclick="document.getElementById(\'teacherImportFile\').click()">📥 Excel / CSV Seç</button><input id="teacherImportFile" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="hidden" onchange="importTeachersFile(event)"></div>'};
  window.importTeachersFile=async function(event){let file=event.target.files[0];if(!file)return;try{let ext=file.name.toLowerCase().split('.').pop(),names=[];if(ext==='csv'){let text=(await file.text()).replace(/^\ufeff/,'');let lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),delimiter=lines[0]?.includes(';')?';':',';names=lines.map((line,i)=>{let first=line.split(delimiter)[0].trim().replace(/^"|"$/g,'');return i===0&&/^(ad\s*soyad|ad|isim|öğretmen|öğretmen\s*adı|name)$/i.test(first)?'':first}).filter(Boolean)}else{if(!window.XLSX){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});names=rows.map((r,i)=>{let first=String(r?.[0]??'').trim();return i===0&&/^(ad\s*soyad|ad|isim|öğretmen|öğretmen\s*adı|name)$/i.test(first)?'':first}).filter(Boolean)}let existing=new Set(db.teachers.map(t=>t.name.trim().toLocaleLowerCase('tr-TR'))),added=0;names.forEach(name=>{let key=name.toLocaleLowerCase('tr-TR');if(!existing.has(key)){db.teachers.push({id:crypto.randomUUID(),name,teaExempt:false,fundExempt:false});existing.add(key);added++}});save();render();alert(added+' öğretmen eklendi. '+(names.length-added)+' kayıt zaten vardı veya tekrarlandı.')}catch(e){alert('Dosya okunamadı. CSV için ilk sütuna öğretmen adlarını yazın; Excel için .xlsx/.xls dosyası seçin.')}finally{event.target.value=''}};
});
</script>
<script>
window.addEventListener('load',()=>{
  db.expenses=Array.isArray(db.expenses)?db.expenses:[];
  const money=n=>Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₺';
  const monthName=k=>{let [y,m]=k.split('-');return m+'/'+y};
  const collectionFor=k=>{let md=db.months[k]||{},tea=0,fund=0;db.teachers.forEach(t=>{let p=md[t.id]||{};if(!t.teaExempt&&p.tea)tea+=db.settings.tea;if(!t.fundExempt&&p.fund)fund+=db.settings.fund});return {tea,fund,total:tea+fund}};
  const expensesFor=k=>db.expenses.filter(e=>e.month===k).reduce((a,e)=>{a[e.category]=(a[e.category]||0)+Number(e.amount||0);a.total+=Number(e.amount||0);return a},{tea:0,fund:0,total:0});
  const allMonths=()=>Object.keys(db.months).concat(db.expenses.map(e=>e.month)).filter((v,i,a)=>v&&a.indexOf(v)===i);
  const allCollection=()=>allMonths().reduce((a,k)=>{let c=collectionFor(k);a.tea+=c.tea;a.fund+=c.fund;a.total+=c.total;return a},{tea:0,fund:0,total:0});
  const allExpense=()=>db.expenses.reduce((a,e)=>{let n=Number(e.amount||0);a[e.category]=(a[e.category]||0)+n;a.total+=n;return a},{tea:0,fund:0,total:0});
  window.expenseModal=function(){
    let k=monthKey();
    document.getElementById('modal').innerHTML='<div class="sheet"><h2>Harcama Ekle</h2><div class="field"><label>Harcama tarihi</label><input id="expenseDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Ay dönemi</label><div class="status">Seçtiğiniz tarih otomatik olarak ilgili aya kaydedilir.</div></div><div class="field"><label>Harcama türü</label><select id="expenseCategory" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px"><option value="tea">☕ Çay</option><option value="fund">💰 Fon</option></select></div><div class="field"><label>Harcama miktarı</label><input id="expenseAmount" type="number" min="0" step="0.01" placeholder="Örn. 750"></div><div class="field"><label>Ne için harcandı?</label><input id="expenseNote" placeholder="Örn. Çay, şeker ve bardak"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn primary" onclick="saveExpense()">Kaydet</button></div></div>';
    document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('expenseAmount').focus(),100);
  }
  window.saveExpense=()=>{let amount=Number(document.getElementById('expenseAmount').value),note=document.getElementById('expenseNote').value.trim(),category=document.getElementById('expenseCategory').value,date=document.getElementById('expenseDate').value;if(!amount||amount<0||!note||!date){alert('Harcama tarihi, miktarı ve açıklaması girilmelidir.');return}let month=date.slice(0,7);db.expenses.push({id:crypto.randomUUID(),month,category,amount,note,date:new Date(date+'T12:00:00').toLocaleDateString('tr-TR')});save();closeModal();render()};
  window.deleteExpense=id=>{if(confirm('Bu harcama silinsin mi?')){db.expenses=db.expenses.filter(e=>e.id!==id);save();render()}};
  window.render=function(){
    let k=monthKey();
    if(!k) return;
    let c=collectionFor(k),e=expensesFor(k),ac=allCollection(),ae=allExpense();
    let teaRemain=c.tea-e.tea,fundRemain=c.fund-e.fund,allTeaRemain=ac.tea-ae.tea,allFundRemain=ac.fund-ae.fund;
    let list=db.expenses.filter(x=>x.month===k).slice().reverse();
    document.getElementById('dashboard').innerHTML='<div class="section-title"><h2>📊 '+monthName(k)+' Özeti</h2><button class="btn primary" onclick="expenseModal()">+ Harcama</button></div><div class="stats"><div class="stat"><div class="label">Bu ay toplanan</div><b>'+money(c.total)+'</b></div><div class="stat"><div class="label">Bu ay harcanan</div><b>'+money(e.total)+'</b></div><div class="stat"><div class="label">Bu ay kalan</div><b>'+money(c.total-e.total)+'</b></div><div class="stat"><div class="label">☕ Çay kalan</div><b>'+money(teaRemain)+'</b></div><div class="stat"><div class="label">💰 Fon kalan</div><b>'+money(fundRemain)+'</b></div><div class="stat"><div class="label">Genel kalan</div><b>'+money(ac.total-ae.total)+'</b></div></div><div class="cards"><div class="card"><h3>☕ Çay</h3><div class="amount">'+money(c.tea)+' <span>bu ay toplandı</span></div><div class="status" style="margin-top:6px">Harcama: '+money(e.tea)+' • Kalan: '+money(teaRemain)+'</div></div><div class="card"><h3>💰 Fon</h3><div class="amount">'+money(c.fund)+' <span>bu ay toplandı</span></div><div class="status" style="margin-top:6px">Harcama: '+money(e.fund)+' • Kalan: '+money(fundRemain)+'</div></div></div><div class="section-title"><h2>📚 Genel Durum</h2></div><div class="cards"><div class="card"><h3>Toplam tahsilat</h3><div class="amount">'+money(ac.total)+'</div></div><div class="card"><h3>Toplam harcama</h3><div class="amount">'+money(ae.total)+'</div></div><div class="card"><h3>☕ Genel çay bakiyesi</h3><div class="amount">'+money(allTeaRemain)+'</div></div><div class="card"><h3>💰 Genel fon bakiyesi</h3><div class="amount">'+money(allFundRemain)+'</div></div><div class="card"><h3>💵 Mevcut para</h3><div class="amount">'+money(ac.total-ae.total)+'</div><div class="status" style="margin-top:6px">Toplam tahsilat − toplam harcama</div></div></div><div class="section-title"><h2>🧾 '+monthName(k)+' Harcamaları</h2></div>'+(list.length?list.map(x=>'<div class="teacher"><div class="teacher-head"><div class="avatar">'+(x.category==='tea'?'☕':'💰')+'</div><div class="name">'+x.note+'<div class="status">'+(x.category==='tea'?'Çay':'Fon')+' • '+x.date+'</div></div><b>'+money(x.amount)+'</b><button class="btn secondary" onclick="deleteExpense(\''+x.id+'\')">Sil</button></div></div>').join(''):'<div class="empty">Bu ay henüz harcama girilmedi.</div>')+'<div class="section-title"><h2>Ödeme Raporu</h2><button class="btn secondary" onclick="exportCSV()">📊 Excel</button></div>';
    document.getElementById('teachersView').innerHTML=view==='teachers'?'<div class="section-title"><h2>Öğretmenler</h2><button class="btn primary" onclick="addTeacher()">+ Ekle</button></div>'+teacherList():'';
    document.getElementById('settingsView').innerHTML=view==='settings'?settingsHTML():'';
  };
  const oldSettings=settingsHTML;
  window.settingsHTML=function(){return oldSettings()+'<div class="setting"><b>🧾 Harcama Yönetimi</b><div class="status" style="margin:6px 0 10px">Çay veya fon parasından yapılan harcamaları buradan da ekleyebilirsiniz.</div><button class="btn primary" onclick="expenseModal()">+ Harcama Ekle</button></div>'};
  render();
});
</script><style>

</style></head><body><main class="app"><header class="top"><div class="brand"><div><small>OKUL ÖDEME TAKİP</small><h1>Çay & Fon Takip</h1></div><button class="icon" onclick="openSettings()">⚙️</button></div><div class="month"><select id="month" onchange="render()"></select><button class="icon" onclick="addTeacher()">＋</button></div></header><section class="content"><div id="dashboard"></div><div id="teachersView"></div><div id="settingsView" class="hidden"></div></section></main><footer class="bottom"><nav class="nav"><button id="navDash" class="active" onclick="showView('dash')">🏠<br>Özet</button><button id="navTeachers" onclick="showView('teachers')">👥<br>Öğretmenler</button><button id="navSettings" onclick="showView('settings')">⚙<br>Ayarlar</button></nav></footer><div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle">Öğretmen Ekle</h2><div class="field"><label>Ad Soyad</label><input id="teacherName" placeholder="Örn. Ahmet Yılmaz"></div><div class="checks"><label class="check"><input type="checkbox" id="teaExempt"> ☕ Çay parasından muaf</label><label class="check"><input type="checkbox" id="fundExempt"> 💰 Fon parasından muaf</label></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn primary" onclick="saveTeacher()">Kaydet</button></div></div></div><script>
function monthKey(){let s=document.getElementById('month');return s?s.value:'';}
function monthData(){let k=monthKey();if(!k)return {};if(!db.months[k])db.months[k]={};return db.months[k]}
function initMonths(){let s=document.getElementById('month');if(!s)return;let now=new Date();let y=now.getFullYear(),m=now.getMonth()+1;let arr=[];for(let i=-6;i<7;i++){let d=new Date(y,m-1+i,1),k=d.toISOString().slice(0,7);arr.push(k)}s.innerHTML=arr.map(k=>{let [a,b]=k.split('-');return `<option value="${k}">${b}/${a}</option>`}).join('');s.value=`${y}-${String(m).padStart(2,'0')}`}
function payment(id,type){let t=db.teachers.find(x=>x.id===id);if(!t||t[type+'Exempt'])return;let md=monthData();md[id]??={};md[id][type]=!md[id][type];md[id][type+'Date']=md[id][type]?new Date().toLocaleDateString('tr-TR'):null;save();render()}
function stats(){let md=monthData(),t=db.teachers;let tea=t.filter(x=>!x.teaExempt&&md[x.id]?.tea).length,fund=t.filter(x=>!x.fundExempt&&md[x.id]?.fund).length;let teaDue=t.filter(x=>!x.teaExempt).length,fundDue=t.filter(x=>!x.fundExempt).length;return {tea,fund,teaDue,fundDue,totalTea:tea*db.settings.tea,totalFund:fund*db.settings.fund,total:tea*db.settings.tea+fund*db.settings.fund}}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function teacherHistory(id){historyTeacherId=id;let t=db.teachers.find(x=>x.id===id);if(!t)return;let months=Object.keys(db.months).sort().reverse(),teaTotal=0,fundTotal=0,paidMonths=0;let rows=months.map(k=>{let p=db.months[k]?.[id]||{},tea=t.teaExempt?0:p.tea?db.settings.tea:0,fund=t.fundExempt?0:p.fund?db.settings.fund:0;if(tea||fund)paidMonths++;teaTotal+=tea;fundTotal+=fund;let [y,m]=k.split('-');return {label:m+'/'+y,p,tea,fund}}).filter(r=>r.tea||r.fund||r.p.teaDate||r.p.fundDate);document.getElementById('modal').innerHTML='<div class="sheet"><div class="section-title"><h2>📜 '+t.name+'</h2><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="stats"><div class="stat"><div class="label">Toplam ödedi</div><b>'+(teaTotal+fundTotal).toLocaleString('tr-TR')+' ₺</b></div><div class="stat"><div class="label">Ödeme yapılan ay</div><b>'+paidMonths+'</b></div></div><div class="cards"><div class="card"><h3>☕ Toplam çay</h3><div class="amount">'+teaTotal.toLocaleString('tr-TR')+' ₺</div></div><div class="card"><h3>💰 Toplam fon</h3><div class="amount">'+fundTotal.toLocaleString('tr-TR')+' ₺</div></div></div><div class="section-title"><h3 style="margin:0">Aylık geçmiş</h3></div>'+(rows.length?rows.map(r=>'<div class="teacher"><div class="teacher-head"><div class="name">'+r.label+'<div class="status">'+(r.p.teaDate?'Çay: '+r.p.teaDate:'')+(r.p.teaDate&&r.p.fundDate?' • ':'')+(r.p.fundDate?'Fon: '+r.p.fundDate:'')+'</div></div><div style="text-align:right;font-weight:800">'+(r.tea?r.tea.toLocaleString('tr-TR')+' ₺':'')+(r.tea&&r.fund?' + ':'')+(r.fund?r.fund.toLocaleString('tr-TR')+' ₺':'')+'</div></div><div class="status" style="margin-top:6px">'+(t.teaExempt?'☕ Muaf':r.p.tea?'☕ Ödendi':'☕ Ödenmedi')+' • '+(t.fundExempt?'💰 Muaf':r.p.fund?'💰 Ödendi':'💰 Ödenmedi')+'</div></div>').join(''):'<div class="empty">Henüz ödeme geçmişi yok.</div>')+'<div class="actions"><button class="btn primary" onclick="closeModal()">Kapat</button></div></div>';document.getElementById('modal').classList.add('open')}
function teacherList(limit){if(!db.teachers.length)return `<div class="empty">Henüz öğretmen eklenmedi.<br><button class="btn primary" style="margin-top:10px" onclick="addTeacher()">İlk öğretmeni ekle</button></div>`;let md=monthData(),q=(document.getElementById('teacherSearch')?.value||'').trim().toLocaleLowerCase('tr-TR');let list=db.teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr',{sensitivity:'base'})).filter(t=>!q||t.name.toLocaleLowerCase('tr-TR').includes(q));if(limit)list=list.slice(0,limit);return list.map(t=>{let p=md[t.id]||{},teaLabel=t.teaExempt?'Muaf':p.tea?'Ödendi':'Ödenmedi',fundLabel=t.fundExempt?'Muaf':p.fund?'Ödendi':'Ödenmedi',badges=[t.teaExempt?'☕ Çay muaf':'',t.fundExempt?'💰 Fon muaf':''].filter(Boolean).join(' • '),status=t.teaExempt&&t.fundExempt?'Tam muaf':(!t.teaExempt&&p.tea)&&(!t.fundExempt&&p.fund)?'Tamamlandı':(!t.teaExempt&&p.tea)||(!t.fundExempt&&p.fund)?'Eksik ödeme':'Ödeme bekliyor';let history=Object.keys(db.months).sort().reverse().filter(k=>{let hp=db.months[k]?.[t.id]||{};return hp.tea||hp.fund}).slice(0,4).map(k=>{let hp=db.months[k][t.id]||{};return k.split('-')[1]+'/'+k.split('-')[0]+': '+(hp.tea?'☕ Ödendi':'')+(hp.tea&&hp.fund?' • ':'')+(hp.fund?'💰 Ödendi':'')}).join(' • ');return `<div class="teacher" onclick="teacherHistory('${t.id}')"><div class="teacher-head"><div class="avatar">${initials(t.name)}</div><div class="name">${t.name}<div class="status">${badges||status}</div></div><button class="btn secondary" onclick="event.stopPropagation();editTeacher('${t.id}')">Düzenle</button><button class="btn secondary" onclick="event.stopPropagation();removeTeacher('${t.id}')">Sil</button></div><div class="payrow" onclick="event.stopPropagation()"><div class="pay"><b>☕ ${t.teaExempt?'Muaf':db.settings.tea+' ₺'}</b><button class="${t.teaExempt?'exempt':p.tea?'paid':'unpaid'}" onclick="payment('${t.id}','tea')">${teaLabel}</button></div><div class="pay"><b>💰 ${t.fundExempt?'Muaf':db.settings.fund+' ₺'}</b><button class="${t.fundExempt?'exempt':p.fund?'paid':'unpaid'}" onclick="payment('${t.id}','fund')">${fundLabel}</button></div></div>${history?`<div class="status" style="margin-top:10px">📜 ${history}</div>`:''}</div>`}).join('')}
function settingsHTML(){return `<div class="section-title"><h2>Ayarlar</h2></div><div class="settings"><div class="setting"><div class="row"><span>☕ Çay parası</span><input type="number" id="teaAmount" value="${db.settings.tea}"></div></div><div class="setting"><div class="row"><span>💰 Fon parası</span><input type="number" id="fundAmount" value="${db.settings.fund}"></div></div><button class="btn primary" onclick="saveSettings()">Ayarları Kaydet</button><button class="btn secondary" onclick="exportCSV()">📊 Excel uyumlu rapor indir</button><div class="setting"><b>💾 Veri Yedekleme</b><div class="status" style="margin:6px 0 10px">Yedekleme dosyası oluşturabilirsiniz.</div><div class="actions"><button class="btn secondary" onclick="backupData()">Yedeği Dışa Aktar</button><button class="btn secondary" onclick="document.getElementById('backupFile').click()">Yedeği Yükle</button></div><input id="backupFile" type="file" accept=".json,application/json" class="hidden" onchange="restoreData(event)"></div><div class="setting"><b>🗑️ Verileri Sıfırla</b><div class="status" style="margin:6px 0 10px">Tüm öğretmen ve ödeme kayıtlarını siler.</div><button class="btn secondary" onclick="resetData()">Tüm Verileri Sıfırla</button></div></div>`}
function showView(v){view=v;document.getElementById('dashboard').classList.toggle('hidden',v!=='dash');document.getElementById('teachersView').classList.toggle('hidden',v!=='teachers');document.getElementById('settingsView').classList.toggle('hidden',v!=='settings');['Dash','Teachers','Settings'].forEach(x=>document.getElementById('nav'+x).classList.toggle('active',v===x.toLowerCase().replace('dash','dash').replace('teachers','teachers').replace('settings','settings')));render()}
function addTeacher(){editingId=null;document.getElementById('modalTitle').textContent='Öğretmen Ekle';document.getElementById('teacherName').value='';document.getElementById('teaExempt').checked=false;document.getElementById('fundExempt').checked=false;document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('teacherName').focus(),100)}
function editTeacher(id){let t=db.teachers.find(x=>x.id===id);if(!t)return;editingId=id;document.getElementById('modalTitle').textContent='Öğretmeni Düzenle';document.getElementById('teacherName').value=t.name;document.getElementById('teaExempt').checked=!!t.teaExempt;document.getElementById('fundExempt').checked=!!t.fundExempt;document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('teacherName').focus(),100)}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modal').innerHTML='<div class="sheet"><h2 id="modalTitle">Öğretmen Ekle</h2><div class="field"><label>Ad Soyad</label><input id="teacherName" placeholder="Örn. Ahmet Yılmaz"></div><div class="checks"><label class="check"><input type="checkbox" id="teaExempt"> ☕ Çay parasından muaf</label><label class="check"><input type="checkbox" id="fundExempt"> 💰 Fon parasından muaf</label></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn primary" onclick="saveTeacher()">Kaydet</button></div></div>';editingId=null}
function saveTeacher(){let n=document.getElementById('teacherName'].value.trim();if(!n)return;let teaExempt=document.getElementById('teaExempt').checked,fundExempt=document.getElementById('fundExempt').checked;if(editingId){let t=db.teachers.find(x=>x.id===editingId);if(t){t.name=n;t.teaExempt=teaExempt;t.fundExempt=fundExempt}}else db.teachers.push({id:crypto.randomUUID(),name:n,teaExempt,fundExempt});save();closeModal();render()}
function removeTeacher(id){if(confirm('Bu öğretmen listeden silinsin mi?')){db.teachers=db.teachers.filter(x=>x.id!==id);save();render()}}
function openSettings(){showView('settings')}
function saveSettings(){let tea=Number(document.getElementById('teaAmount').value)||0,fund=Number(document.getElementById('fundAmount').value)||0;db.settings={tea,fund};save();render();alert('Ayarlar kaydedildi.')}
function backupData(){let payload={app:'Hasköy Ortaokulu Çay & Fon Takip',version:1,exportedAt:new Date().toISOString(),data:db};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cay-fon-yedek-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(event){let file=event.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let payload=JSON.parse(reader.result),data=payload.data||payload;if(!data||!Array.isArray(data.teachers)||typeof data.months!=='object'||typeof data.settings!=='object')throw new Error('Geçersiz yedek');if(!confirm('Mevcut verilerin üzerine bu yedek yüklensin mi?'))return;db.teachers=data.teachers;db.months=data.months;db.settings=data.settings;db.expenses=data.expenses||[];save();initMonths();render();alert('Yedek başarıyla yüklendi.')}catch(e){alert('Yedek dosyası okunamadı. Lütfen uygulamanın oluşturduğu JSON yedeğini seçin.')}finally{event.target.value=''}};reader.readAsText(file)}
function resetData(){if(confirm('TÜM öğretmen, ödeme ve ayar verileri silinsin mi? Bu işlem geri alınamaz.')){window.appDb.data={teachers:[],months:{},settings:{tea:150,fund:100},expenses:[]};save();render();}}
function exportCSV(){let md=monthData(),k=monthKey(),rows=[['Öğretmen','Çay Durumu','Çay Tutarı','Çay Tarihi','Fon Durumu','Fon Tutarı','Fon Tarihi','Toplam']];db.teachers.forEach(t=>{let p=md[t.id]||{},teaStatus=t.teaExempt?'Muaf':p.tea?'Ödendi':'Ödenmedi',fundStatus=t.fundExempt?'Muaf':p.fund?'Ödendi':'Ödenmedi',teaAmount=t.teaExempt?0:p.tea?db.settings.tea:0,fundAmount=t.fundExempt?0:p.fund?db.settings.fund:0;rows.push([t.name,teaStatus,teaAmount,t.teaExempt?'':p.teaDate||'',fundStatus,fundAmount,t.fundExempt?'':p.fundDate||'',teaAmount+fundAmount])});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cay-fon-${k}.csv`;a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
