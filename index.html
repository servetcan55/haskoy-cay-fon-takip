<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#292e88">
<title>Çay & Fon Takip</title>

<!-- Firebase SDK'ları -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDP39vv_IMJHNHrXauWyfQ2VU9bqRinjTc",
    authDomain: "haskoy-cay-fon-takip.firebaseapp.com",
    projectId: "haskoy-cay-fon-takip",
    storageBucket: "haskoy-cay-fon-takip.firebasestorage.app",
    messagingSenderId: "1034982087143",
    appId: "1:1034982087143:web:d7c3e465d7b32225c58542",
    measurementId: "G-LG04T4X6JB"
  };
  firebase.initializeApp(firebaseConfig);
  const dbFirestore = firebase.firestore();
  const docRef = dbFirestore.collection("cayFonData").doc("mainDoc");

  const LOCAL_KEY = 'cayFonTakipV1';
  let db = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null') || {teachers:[], months:{}, settings:{tea:150, fund:100}, expenses:[]};
  let view = 'dash', editingId = null;

  function save() {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
    docRef.set(db).catch(err => console.error("Kayıt hatası:", err));
  }

  docRef.onSnapshot((docSnap) => {
    if (docSnap.exists) {
      let data = docSnap.data();
      if(data && (data.teachers?.length > 0 || Object.keys(data.months || {}).length > 0 || data.expenses?.length > 0)) {
        db.teachers = Array.isArray(data.teachers) ? data.teachers : [];
        db.months = (data.months && typeof data.months === 'object') ? data.months : {};
        db.settings = data.settings || {tea:150, fund:100};
        db.expenses = Array.isArray(data.expenses) ? data.expenses : [];
        localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
      }
    } else {
      save();
    }
    if(typeof render === 'function') render();
  }, (error) => {
    console.error("Firebase bağlantı hatası:", error);
  });
</script>

<style>
:root{--navy:#292e88;--orange:#ec6701;--bg:#f5f6fb;--card:#fff;--text:#171a2b;--muted:#73788f;--line:#e6e8f0;--green:#16864a;--red:#c93a3a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text)}
button,input,select{font:inherit}
.app{width:100%;max-width:760px;margin:auto;padding-bottom:82px}
.top{background:linear-gradient(135deg,var(--navy),#4147a7);color:#fff;padding:20px 18px 16px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand h1{font-size:20px;margin:0}
.brand small{opacity:.72;font-size:10px}
.month{margin-top:13px;display:flex;gap:8px}
.month select{flex:1;background:#fff;color:var(--text);border:0;border-radius:11px;padding:11px 12px;font-weight:700}
.icon{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:11px;width:42px;cursor:pointer}
.content{padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .label{font-size:11px;color:var(--muted)}
.stat b{font-size:19px;display:block;margin-top:4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h3{font-size:13px;margin:0 0 8px}
.amount{font-size:18px;font-weight:800}
.amount span{font-size:11px;color:var(--muted);font-weight:500}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:17px 0 9px}
.section-title h2{font-size:16px;margin:0}
.btn{border:0;border-radius:10px;padding:9px 11px;font-weight:750;cursor:pointer}
.primary{background:var(--orange);color:#fff}
.secondary{background:#eef0ff;color:var(--navy)}
.teacher{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px;margin-bottom:8px}
.teacher-head{display:flex;align-items:center;gap:8px}
.avatar{width:38px;height:38px;border-radius:11px;background:#eef0ff;color:var(--navy);display:grid;place-items:center;font-weight:800}
.name{font-weight:750;flex:1;font-size:14px}
.status{font-size:10px;color:var(--muted)}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.pay{border:1px solid var(--line);background:#fafbfe;border-radius:10px;padding:8px;display:flex;justify-content:space-between;align-items:center}
.pay b{font-size:11px}
.pay button{border:0;border-radius:8px;padding:6px 8px;font-weight:800;font-size:11px;cursor:pointer}
.paid{background:#e9f7ef;color:var(--green)}
.unpaid{background:#fff0f0;color:var(--red)}
.empty{background:#fff;border:1px dashed #cfd3e2;padding:22px;border-radius:14px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;width:100%;height:64px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav{width:min(760px,100%);height:64px;display:grid;grid-template-columns:repeat(3,1fr);padding:5px 9px}
.nav button{border:0;background:none;color:var(--muted);padding:5px;border-radius:10px;font-size:11px;cursor:pointer}
.nav button.active{color:var(--navy);background:#eef0ff;font-weight:800}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 13px}
.field{margin:9px 0}
.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;outline:0}
.actions{display:flex;gap:7px;margin-top:13px}
.actions button{flex:1}
.settings{display:grid;gap:9px}
.setting{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
.setting input{width:105px;margin-left:auto;padding:8px;border:1px solid var(--line);border-radius:9px;display:block}
.row{display:flex;align-items:center;justify-content:space-between}
.hidden{display:none!important}
@media(min-width:700px){.content{padding:22px}.top{padding:22px}.modal{align-items:center}.sheet{border-radius:20px;max-width:520px}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <div><small>OKUL ÖDEME TAKİP</small><h1>Çay & Fon Takip</h1></div>
      <button class="icon" onclick="openSettings()">⚙️</button>
    </div>
    <div class="month">
      <select id="month" onchange="render()"></select>
      <button class="icon" onclick="addTeacher()">＋</button>
    </div>
  </header>
  <section class="content">
    <div id="dashboard"></div>
    <div id="teachersView" class="hidden"></div>
    <div id="settingsView" class="hidden"></div>
  </section>
</main>
<footer class="bottom">
  <nav class="nav">
    <button id="navDash" class="active" onclick="showView('dash')">🏠<br>Özet</button>
    <button id="navTeachers" onclick="showView('teachers')">👥<br>Öğretmenler</button>
    <button id="navSettings" onclick="showView('settings')">⚙️<br>Ayarlar</button>
  </nav>
</footer>
<div id="modal" class="modal"></div>

<script>
function monthKey(){
  let s = document.getElementById('month');
  if(s && s.value) return s.value;
  let now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}
function monthData(){
  let k = monthKey();
  if(!db.months[k]) db.months[k] = {};
  return db.months[k];
}
function initMonths(){
  let s = document.getElementById('month');
  if(!s) return;
  let now = new Date();
  let y = now.getFullYear(), m = now.getMonth()+1;
  let arr = [];
  for(let i=-6; i<7; i++){
    let d = new Date(y, m-1+i, 1);
    arr.push(d.toISOString().slice(0,7));
  }
  s.innerHTML = arr.map(k => { let [a,b]=k.split('-'); return `<option value="${k}">${b}/${a}</option>`; }).join('');
  s.value = `${y}-${String(m).padStart(2,'0')}`;
}
function payment(id, type){
  let t = db.teachers.find(x => x.id === id);
  if(!t || t[type+'Exempt']) return;
  let md = monthData();
  md[id] ??= {};
  md[id][type] = !md[id][type];
  md[id][type+'Date'] = md[id][type] ? new Date().toLocaleDateString('tr-TR') : null;
  save(); render();
}
function initials(n){ return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(); }

function teacherList(limit){
  if(!db.teachers.length) return `<div class="empty">Henüz öğretmen eklenmedi.<br><button class="btn primary" style="margin-top:10px" onclick="addTeacher()">İlk öğretmeni ekle</button></div>`;
  let md = monthData();
  let q = (document.getElementById('teacherSearch')?.value || '').trim().toLocaleLowerCase('tr-TR');
  let list = db.teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr',{sensitivity:'base'})).filter(t=>!q || t.name.toLocaleLowerCase('tr-TR').includes(q));
  if(limit) list = list.slice(0, limit);
  return list.map(t=>{
    let p = md[t.id] || {};
    let teaLabel = t.teaExempt ? 'Muaf' : p.tea ? 'Ödendi' : 'Ödenmedi';
    let fundLabel = t.fundExempt ? 'Muaf' : p.fund ? 'Ödendi' : 'Ödenmedi';
    let badges = [t.teaExempt ? '☕ Çay muaf' : '', t.fundExempt ? '💰 Fon muaf' : ''].filter(Boolean).join(' • ');
    return `<div class="teacher"><div class="teacher-head"><div class="avatar">${initials(t.name)}</div><div class="name">${t.name}<div class="status">${badges || 'Aktif'}</div></div><button class="btn secondary" onclick="editTeacher('${t.id}')">Düzenle</button><button class="btn secondary" onclick="removeTeacher('${t.id}')">Sil</button></div><div class="payrow"><div class="pay"><b>☕ ${t.teaExempt?'Muaf':db.settings.tea+' ₺'}</b><button class="${t.teaExempt?'exempt':p.tea?'paid':'unpaid'}" onclick="payment('${t.id}','tea')">${teaLabel}</button></div><div class="pay"><b>💰 ${t.fundExempt?'Muaf':db.settings.fund+' ₺'}</b><button class="${t.fundExempt?'exempt':p.fund?'paid':'unpaid'}" onclick="payment('${t.id}','fund')">${fundLabel}</button></div></div></div>`;
  }).join('');
}

function showView(v){
  view = v;
  document.getElementById('dashboard').classList.toggle('hidden', v !== 'dash');
  document.getElementById('teachersView').classList.toggle('hidden', v !== 'teachers');
  document.getElementById('settingsView').classList.toggle('hidden', v !== 'settings');
  ['Dash','Teachers','Settings'].forEach(x => document.getElementById('nav'+x)?.classList.toggle('active', v.toLowerCase() === x.toLowerCase()));
  render();
}

function openSettings(){ showView('settings'); }

function saveSettings(){
  db.settings.tea = Number(document.getElementById('teaAmount').value) || 0;
  db.settings.fund = Number(document.getElementById('fundAmount').value) || 0;
  save();
  alert('Ayarlar kaydedildi.');
  showView('dash');
}

function addTeacher(){
  editingId = null;
  document.getElementById('modal').innerHTML = `
    <div class="sheet">
      <h2>Öğretmen Ekle</h2>
      <div class="field"><label>Ad Soyad</label><input id="teacherName" placeholder="Örn. Ahmet Yılmaz"></div>
      <div class="checks" style="margin:10px 0">
        <label><input type="checkbox" id="teaExempt"> ☕ Çay parasından muaf</label><br>
        <label><input type="checkbox" id="fundExempt"> 💰 Fon parasından muaf</label>
      </div>
      <div class="actions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn primary" onclick="saveTeacher()">Kaydet</button></div>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('teacherName').focus(), 100);
}

function editTeacher(id){
  let t = db.teachers.find(x => x.id === id);
  if(!t) return;
  editingId = id;
  document.getElementById('modal').innerHTML = `
    <div class="sheet">
      <h2>Öğretmeni Düzenle</h2>
      <div class="field"><label>Ad Soyad</label><input id="teacherName" value="${t.name}"></div>
      <div class="checks" style="margin:10px 0">
        <label><input type="checkbox" id="teaExempt" ${t.teaExempt?'checked':''}> ☕ Çay parasından muaf</label><br>
        <label><input type="checkbox" id="fundExempt" ${t.fundExempt?'checked':''}> 💰 Fon parasından muaf</label>
      </div>
      <div class="actions"><button class="btn secondary" onclick="closeModal()">Vazgeç</button><button class="btn primary" onclick="saveTeacher()">Kaydet</button></div>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('teacherName').focus(), 100);
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function saveTeacher(){
  let n = document.getElementById('teacherName').value.trim();
  if(!n) return;
  let teaExempt = document.getElementById('teaExempt').checked;
  let fundExempt = document.getElementById('fundExempt').checked;
  if(editingId){
    let t = db.teachers.find(x => x.id === editingId);
    if(t){ t.name = n; t.teaExempt = teaExempt; t.fundExempt = fundExempt; }
  } else {
    db.teachers.push({id: crypto.randomUUID(), name: n, teaExempt, fundExempt});
  }
  save(); closeModal(); render();
}

function removeTeacher(id){
  if(confirm('Bu öğretmen silinsin mi?')){
    db.teachers = db.teachers.filter(x => x.id !== id);
    save(); render();
  }
}

function resetData(){
  if(confirm('Tüm veriler silinecek?')){
    db = {teachers:[], months:{}, settings:{tea:150, fund:100}, expenses:[]};
    save(); render();
  }
}

function exportCSV(){
  let md = monthData(), k = monthKey();
  let rows = [['Öğretmen', 'Çay Durumu', 'Çay Tutarı', 'Çay Tarihi', 'Fon Durumu', 'Fon Tutarı', 'Fon Tarihi', 'Toplam']];
  db.teachers.forEach(t=>{
    let p = md[t.id] || {};
    let teaStatus = t.teaExempt ? 'Muaf' : p.tea ? 'Ödendi' : 'Ödenmedi';
    let fundStatus = t.fundExempt ? 'Muaf' : p.fund ? 'Ödendi' : 'Ödenmedi';
    let teaAmount = t.teaExempt ? 0 : p.tea ? db.settings.tea : 0;
    let fundAmount = t.fundExempt ? 0 : p.fund ? db.settings.fund : 0;
    rows.push([t.name, teaStatus, teaAmount, t.teaExempt?'':p.teaDate||'', fundStatus, fundAmount, t.fundExempt?'':p.fundDate||'', teaAmount+fundAmount]);
  });
  let csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replaceAll('"','""') + '"').join(';')).join('\r\n');
  let blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cay-fon-${k}.csv`;
  a.click();
}

function render(){
  initMonths();
  if(view === 'dash'){
    let st = stats();
    let money = n => Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₺';
    document.getElementById('dashboard').innerHTML = `
      <div class="stats">
        <div class="stat"><div class="label">Toplam öğretmen</div><b>${db.teachers.length}</b></div>
        <div class="stat"><div class="label">Toplam tahsilat</div><b>${money(st.total)}</b></div>
        <div class="stat"><div class="label">☕ Çay</div><b>${st.tea}/${st.teaDue}</b></div>
        <div class="stat"><div class="label">💰 Fon</div><b>${st.fund}/${st.fundDue}</b></div>
      </div>
      <div class="section-title"><h2>Öğretmenler</h2><button class="btn primary" onclick="addTeacher()">+ Ekle</button></div>
      <div class="field"><input id="teacherSearch" oninput="render()" placeholder="🔎 Öğretmen ara..."></div>
      <div id="teacherListContainer">${teacherList(8)}</div>
    `;
  } else if(view === 'teachers'){
    document.getElementById('teachersView').innerHTML = `
      <div class="section-title"><h2>Öğretmenler</h2><button class="btn primary" onclick="addTeacher()">+ Ekle</button></div>
      <div class="field"><input id="teacherSearch" oninput="render()" placeholder="🔎 Öğretmen ara..."></div>
      ${teacherList()}
    `;
  } else if(view === 'settings'){
    document.getElementById('settingsView').innerHTML = `
      <div class="section-title"><h2>Ayarlar</h2></div>
      <div class="settings">
        <div class="setting"><div class="row"><span>☕ Çay parası</span><input type="number" id="teaAmount" value="${db.settings.tea}"></div></div>
        <div class="setting"><div class="row"><span>💰 Fon parası</span><input type="number" id="fundAmount" value="${db.settings.fund}"></div></div>
        <button class="btn primary" onclick="saveSettings()">Ayarları Kaydet</button>
        <div class="setting"><b>🗑️ Verileri Sıfırla</b><div class="status" style="margin:6px 0 10px">Tüm öğretmen ve ödeme kayıtlarını siler.</div><button class="btn secondary" onclick="resetData()">Tüm Verileri Sıfırla</button></div>
      </div>
    `;
  }
}

function stats(){
  let md = monthData(), t = db.teachers;
  let tea = t.filter(x => !x.teaExempt && md[x.id]?.tea).length;
  let fund = t.filter(x => !x.fundExempt && md[x.id]?.fund).length;
  let teaDue = t.filter(x => !x.teaExempt).length;
  let fundDue = t.filter(x => !x.fundExempt).length;
  return {
    tea, fund, teaDue, fundDue,
    totalTea: tea * db.settings.tea,
    totalFund: fund * db.settings.fund,
    total: (tea * db.settings.tea) + (fund * db.settings.fund)
  };
}

window.addEventListener('load', () => {
  render();
});
</script>
</body>
</html>
